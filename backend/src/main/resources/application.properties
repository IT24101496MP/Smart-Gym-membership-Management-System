
spring.application.name=fat2fit

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/fat2fit_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Jackson Date/Time Configuration
spring.jackson.time-zone=Asia/Colombo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# Timezone for Tomcat
server.servlet.jsp.init-parameters.listings=false

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging Configuration
logging.level.lk.fat2fit=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Controller=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Service=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Repository=TRACE
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tomcat specific - increase limits to match Spring limits
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-part-count=50



# CORS Configuration
#app.cors.allowed-origins=${FRONTEND_URL},http://localhost:5173
# JWT Configuration
jwt.secret=${JWT_SECRET:f2fSuperSecretKeyThatIsAtLeast256BitsLong!@#$%^&*()}
# Access token: 15 minutes
jwt.expiration=900000
# Refresh token: 7 days
jwt.refresh-expiration=604800000

# Default Admin Seed Credentials
admin.seed.email=${ADMIN_EMAIL:admin@fat2fit.lk}
admin.seed.password=${ADMIN_PASSWORD:Admin@1234}
admin.seed.firstName=${ADMIN_FIRST_NAME:System}
admin.seed.lastName=${ADMIN_LAST_NAME:Admin}
admin.seed.phone=${ADMIN_PHONE:0700000000}

# Avoid devtools restart classloader conflicts (ClassNotFound on edited classes)
spring.devtools.restart.enabled=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true