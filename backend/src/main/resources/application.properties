spring.application.name=fat2fit

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/fat2fit_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Jackson Date/Time Configuration
spring.jackson.time-zone=Asia/Colombo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# Timezone for Tomcat
server.servlet.jsp.init-parameters.listings=false

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging Configuration
logging.level.lk.fat2fit=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Controller=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Service=DEBUG
logging.level.lk.fat2fit.Fat2Fit.Repository=TRACE
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS Configuration
#app.cors.allowed-origins=${FRONTEND_URL},http://localhost:5173